<svg viewBox="0 0 512 768" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="nova-title">
  <title id="nova-title">Nova — Genesis Agent portrait</title>
  <style>
    .nova-eye { animation: nova-blink 4.4s ease-in-out infinite; transform-origin: 256px 342px; }
    .nova-burst { animation: nova-ignite 2.4s ease-in-out infinite; transform-origin: 256px 342px; }
    @keyframes nova-blink {
      0%, 88%, 100% { transform: scaleY(1); }
      93% { transform: scaleY(0.1); }
    }
    @keyframes nova-ignite {
      0%, 100% { opacity: 0.45; transform: scale(0.94); }
      50% { opacity: 0.9; transform: scale(1.1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .nova-eye, .nova-burst { animation: none; }
    }
  </style>

  <defs>
    <linearGradient id="n-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B79BDB" />
      <stop offset="50%" stop-color="#7A5FA0" />
      <stop offset="100%" stop-color="#3E2E63" />
    </linearGradient>
    <linearGradient id="n-shade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14251C" stop-opacity="0" />
      <stop offset="100%" stop-color="#14251C" stop-opacity="0.32" />
    </linearGradient>
    <radialGradient id="n-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5FFCF" />
      <stop offset="55%" stop-color="#C8F135" />
      <stop offset="100%" stop-color="#7BB13C" />
    </radialGradient>
    <filter id="n-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#14251C" flood-opacity="0.24" />
    </filter>
  </defs>

  <g filter="url(#n-shadow)">
    <!-- shoulders / torso, cloaked -->
    <path
      d="M84 768 L98 560 C 104 500, 154 460, 212 448 L 300 448 C 358 460, 408 500, 414 560 L 428 768 Z"
      fill="url(#n-metal)"
    />
    <path d="M84 768 L98 560 C 104 500, 154 460, 212 448 L 256 448 L 256 768 Z" fill="url(#n-shade)" />
    <path d="M228 450 L284 450 L296 620 L216 620 Z" fill="#14251C" opacity="0.3" />

    <!-- collar -->
    <path d="M206 424 L306 424 L286 464 L226 464 Z" fill="#3E2E63" />

    <!-- pointed launch-nose hood -->
    <path
      d="M256 88
         L358 244
         C 376 274, 380 312, 368 346
         L 346 412
         C 336 434, 314 448, 290 448
         L 222 448
         C 198 448, 176 434, 166 412
         L 144 346
         C 132 312, 136 274, 154 244
         Z"
      fill="url(#n-metal)"
    />
    <path
      d="M256 88 L358 244 C 376 274, 380 312, 368 346 L 346 412 C 336 434, 314 448, 290 448 L 256 448 Z"
      fill="url(#n-shade)"
    />
    <path
      d="M256 88 L358 244 C 376 274, 380 312, 368 346 L 346 412 C 336 434, 314 448, 290 448 L 222 448 C 198 448, 176 434, 166 412 L 144 346 C 132 312, 136 274, 154 244 Z"
      fill="none"
      stroke="#C8F135"
      stroke-width="2"
      opacity="0.35"
    />

    <!-- starburst ignition rays -->
    <g class="nova-burst" stroke="#C8F135" stroke-width="7" stroke-linecap="round">
      <line x1="256" y1="240" x2="256" y2="200" />
      <line x1="326" y1="278" x2="356" y2="252" />
      <line x1="186" y1="278" x2="156" y2="252" />
    </g>

    <!-- eye housing -->
    <ellipse cx="256" cy="342" rx="58" ry="44" fill="#14251C" opacity="0.5" />

    <!-- single eye -->
    <g class="nova-eye">
      <ellipse cx="256" cy="342" rx="46" ry="34" fill="#14251C" opacity="0.9" />
      <ellipse cx="256" cy="342" rx="22" ry="16" fill="url(#n-glow)" />
    </g>

    <!-- speed streaks -->
    <g stroke="#EEF1E8" stroke-width="5" stroke-linecap="round" opacity="0.55">
      <line x1="204" y1="404" x2="188" y2="422" />
      <line x1="308" y1="404" x2="324" y2="422" />
    </g>
  </g>
</svg>
