<svg viewBox="0 0 512 768" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="echo-title">
  <title id="echo-title">Echo — Genesis Agent portrait</title>
  <style>
    .echo-eye { animation: echo-blink 4.6s ease-in-out infinite; transform-origin: 256px 320px; }
    .echo-ring { animation: echo-pulse 3.2s ease-in-out infinite; transform-origin: 256px 320px; }
    .echo-ring-2 { animation-delay: 0.5s; }
    @keyframes echo-blink {
      0%, 90%, 100% { transform: scaleY(1); }
      94% { transform: scaleY(0.1); }
    }
    @keyframes echo-pulse {
      0%, 100% { opacity: 0.18; transform: scale(0.92); }
      50% { opacity: 0.42; transform: scale(1.05); }
    }
    @media (prefers-reduced-motion: reduce) {
      .echo-eye, .echo-ring { animation: none; }
    }
  </style>

  <defs>
    <linearGradient id="e-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CFE9C6" />
      <stop offset="50%" stop-color="#8FBF9F" />
      <stop offset="100%" stop-color="#3D8A7E" />
    </linearGradient>
    <linearGradient id="e-shade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14251C" stop-opacity="0" />
      <stop offset="100%" stop-color="#14251C" stop-opacity="0.3" />
    </linearGradient>
    <radialGradient id="e-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EAFBFF" />
      <stop offset="55%" stop-color="#4FC7C2" />
      <stop offset="100%" stop-color="#2E8F8A" />
    </radialGradient>
    <filter id="e-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#14251C" flood-opacity="0.2" />
    </filter>
  </defs>

  <g filter="url(#e-shadow)">
    <!-- shoulders / torso -->
    <path
      d="M92 768 L104 566 C 110 512, 156 476, 210 464 L 302 464 C 356 476, 402 512, 408 566 L 420 768 Z"
      fill="url(#e-metal)"
    />
    <path d="M92 768 L104 566 C 110 512, 156 476, 210 464 L 256 464 L 256 768 Z" fill="url(#e-shade)" />
    <ellipse cx="256" cy="520" rx="46" ry="18" fill="#2E8F8A" opacity="0.4" />

    <!-- collar -->
    <ellipse cx="256" cy="452" rx="66" ry="22" fill="#2E8F8A" />

    <!-- radar rings -->
    <circle class="echo-ring" cx="256" cy="320" r="150" fill="none" stroke="#2E8F8A" stroke-width="4" opacity="0.25" />
    <circle class="echo-ring echo-ring-2" cx="256" cy="320" r="118" fill="none" stroke="#2E8F8A" stroke-width="4" opacity="0.3" />

    <!-- rounded head -->
    <circle cx="256" cy="320" r="118" fill="url(#e-metal)" />
    <circle cx="256" cy="320" r="118" fill="url(#e-shade)" />
    <circle cx="256" cy="320" r="118" fill="none" stroke="#EAFBFF" stroke-width="2" opacity="0.5" />

    <!-- ear tufts -->
    <path d="M158 250 C 140 224, 148 190, 176 180 C 168 212, 168 234, 172 256 Z" fill="url(#e-metal)" />
    <path d="M354 250 C 372 224, 364 190, 336 180 C 344 212, 344 234, 340 256 Z" fill="url(#e-metal)" />

    <!-- eye housing -->
    <circle cx="256" cy="320" r="52" fill="#14251C" opacity="0.88" />
    <circle cx="256" cy="320" r="52" fill="none" stroke="#EAFBFF" stroke-width="1.5" opacity="0.4" />

    <!-- eye: concentric listening rings -->
    <g class="echo-eye">
      <circle cx="256" cy="320" r="30" fill="url(#e-glow)" />
      <circle cx="256" cy="320" r="30" fill="none" stroke="#EAFBFF" stroke-width="3" opacity="0.6" />
      <circle cx="256" cy="320" r="11" fill="#EAFBFF" />
    </g>

    <!-- signal accent marks -->
    <g stroke="#2E8F8A" stroke-width="6" stroke-linecap="round" opacity="0.65">
      <path d="M336 282 C 354 296, 354 344, 336 358" fill="none" />
      <path d="M176 282 C 158 296, 158 344, 176 358" fill="none" />
    </g>
  </g>
</svg>
