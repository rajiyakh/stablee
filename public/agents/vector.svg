<svg viewBox="0 0 512 768" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="vector-title">
  <title id="vector-title">Vector — Genesis Agent portrait</title>
  <style>
    .vector-eye { animation: vector-blink 5.2s ease-in-out infinite; transform-origin: 256px 296px; }
    @keyframes vector-blink {
      0%, 90%, 100% { transform: scaleY(1); }
      94% { transform: scaleY(0.12); }
    }
    @media (prefers-reduced-motion: reduce) {
      .vector-eye { animation: none; }
    }
  </style>

  <defs>
    <linearGradient id="v-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E4FA7C" />
      <stop offset="45%" stop-color="#C8F135" />
      <stop offset="100%" stop-color="#5FA83E" />
    </linearGradient>
    <linearGradient id="v-shade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14251C" stop-opacity="0" />
      <stop offset="100%" stop-color="#14251C" stop-opacity="0.32" />
    </linearGradient>
    <radialGradient id="v-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5FFCF" />
      <stop offset="55%" stop-color="#C8F135" />
      <stop offset="100%" stop-color="#7BB13C" />
    </radialGradient>
    <filter id="v-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#14251C" flood-opacity="0.22" />
    </filter>
  </defs>

  <g filter="url(#v-shadow)">
    <!-- shoulders / torso -->
    <path
      d="M96 768 L108 560 C 112 508, 156 470, 208 458 L 304 458 C 356 470, 400 508, 404 560 L 416 768 Z"
      fill="url(#v-metal)"
    />
    <path d="M96 768 L108 560 C 112 508, 156 470, 208 458 L 256 458 L 256 768 Z" fill="url(#v-shade)" />
    <path
      d="M226 460 L286 460 L296 560 L216 560 Z"
      fill="#14251C"
      opacity="0.28"
    />
    <path d="M226 460 L286 460 L296 560 L216 560 Z" fill="none" stroke="#E4FA7C" stroke-width="2" opacity="0.5" />

    <!-- neck collar -->
    <path d="M212 420 L300 420 L292 462 L220 462 Z" fill="#3D7A2C" />

    <!-- hood: angular, forward-pointing -->
    <path
      d="M256 96
         L364 158
         C 378 165, 385 179, 383 194
         L 366 356
         C 363 380, 348 398, 326 405
         L 256 428
         L 186 405
         C 164 398, 149 380, 146 356
         L 129 194
         C 127 179, 134 165, 148 158
         Z"
      fill="url(#v-metal)"
    />
    <path
      d="M256 96 L364 158 C 378 165, 385 179, 383 194 L 366 356 C 363 380, 348 398, 326 405 L 256 428 Z"
      fill="url(#v-shade)"
    />
    <path
      d="M256 96 L364 158 C 378 165, 385 179, 383 194 L 366 356 C 363 380, 348 398, 326 405 L 256 428 L 186 405 C 164 398, 149 380, 146 356 L 129 194 C 127 179, 134 165, 148 158 Z"
      fill="none"
      stroke="#F5FFCF"
      stroke-width="2.5"
      opacity="0.55"
    />

    <!-- panel seams -->
    <g stroke="#14251C" stroke-width="2.5" opacity="0.25">
      <path d="M180 168 L168 340" fill="none" />
      <path d="M332 168 L344 340" fill="none" />
    </g>

    <!-- visor housing -->
    <rect x="182" y="272" width="148" height="42" rx="18" fill="#14251C" opacity="0.9" />
    <rect x="182" y="272" width="148" height="42" rx="18" fill="none" stroke="#E4FA7C" stroke-width="1.5" opacity="0.4" />

    <!-- glowing visor -->
    <g class="vector-eye">
      <rect x="196" y="280" width="66" height="24" rx="12" fill="url(#v-glow)" />
      <rect x="196" y="280" width="66" height="24" rx="12" fill="#F5FFCF" opacity="0.35" />
    </g>

    <!-- brow accent -->
    <path d="M196 244 L316 244" stroke="#14251C" stroke-width="7" stroke-linecap="round" opacity="0.4" />

    <!-- speed lines -->
    <g stroke="#C8F135" stroke-width="9" stroke-linecap="round" opacity="0.7">
      <line x1="374" y1="230" x2="440" y2="206" />
      <line x1="384" y1="270" x2="452" y2="256" />
      <line x1="378" y1="312" x2="444" y2="310" />
    </g>
  </g>
</svg>
